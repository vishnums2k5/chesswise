services:
  - type: web
    name: chesswise-analysis-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @chesswise/database db:generate
    startCommand: pnpm --filter @chesswise/analysis-worker start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ANALYSIS_DEPTH
        value: "14"
      - key: GEMINI_API_KEY
        sync: false
